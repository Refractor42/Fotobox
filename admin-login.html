<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SnapBox — Admin-PIN</title>
  <style>
    :root {
      color-scheme: dark;
      --c-bg: #0b0c10;
      --c-surface: #15171e;
      --c-border: rgba(255, 255, 255, 0.09);
      --c-accent: #facc15;
      --c-accent-glow: rgba(250, 204, 21, 0.3);
      --c-text: #ffffff;
      --c-text-muted: #94a3b8;
      --c-danger: #f87171;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 600px at 15% 0%, rgba(250, 204, 21, 0.09), transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(56, 189, 248, 0.07), transparent 55%),
        var(--c-bg);
      color: var(--c-text);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 34px 32px 28px;
      border: 1px solid var(--c-border);
      border-radius: 24px;
      background: rgba(21, 23, 30, 0.92);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand__logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #facc15 20%, #38bdf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand__badge {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--c-accent);
      border: 1px solid rgba(250, 204, 21, 0.35);
      background: rgba(250, 204, 21, 0.12);
      border-radius: 999px;
      padding: 3px 9px;
    }

    .lock {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--c-accent);
      background: rgba(250, 204, 21, 0.1);
      border: 1px solid rgba(250, 204, 21, 0.28);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--c-text-muted);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--c-text-muted);
    }

    .pin-input {
      width: 100%;
      height: 58px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background: #0d0f14;
      color: var(--c-text);
      font: inherit;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.42em;
      text-align: center;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .pin-input::placeholder {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #5b6472;
    }

    .pin-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px var(--c-accent-glow);
    }

    .login-btn {
      width: 100%;
      min-height: 56px;
      margin-top: 16px;
      border: 0;
      border-radius: 999px;
      background: var(--c-accent);
      color: #0b0c10;
      font: inherit;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .login-btn:hover:not(:disabled) {
      background: #eab308;
      box-shadow: 0 8px 24px var(--c-accent-glow);
      transform: translateY(-1px);
    }

    .login-btn:active:not(:disabled) { transform: scale(0.985); }

    .login-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .login-btn:disabled {
      cursor: progress;
      opacity: 0.65;
      transform: none;
    }

    .notice {
      margin: -10px 0 18px;
      text-align: center;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--c-accent);
    }
    .notice[hidden] { display: none; }

    .error {
      min-height: 22px;
      margin: 12px 0 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--c-danger);
    }

    .note {
      margin: 18px 0 0;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--c-text-muted);
      font-size: 0.82rem;
      text-decoration: none;
    }

    .back:hover { color: var(--c-text); background: rgba(255, 255, 255, 0.05); }

    .back-wrap { text-align: center; }

    .is-shaking { animation: shake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    @media (max-width: 420px) {
      body { padding: 14px; }
      .login-card { padding: 26px 20px 22px; border-radius: 20px; }
      .pin-input { height: 54px; font-size: 1.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card, .is-shaking { animation: none; }
    }
  </style>
</head>
<body>
  <main class="login-card" id="loginCard">
    <div class="brand">
      <span class="brand__logo">SnapBox</span>
      <span class="brand__badge">Admin</span>
    </div>

    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>

    <h1>Admin-Bereich</h1>
    <p class="subtitle">Bitte PIN eingeben, um Format, Sprache, Zeiten, Aufnahme-Standards, Farben und Galerie zu ändern.</p>
    <p class="notice" id="sessionNotice" hidden>Du wurdest abgemeldet.</p>

    <form id="pinForm" novalidate>
      <label for="pinInput">PIN</label>
      <input
        class="pin-input"
        id="pinInput"
        name="pin"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        minlength="4"
        maxlength="8"
        autocomplete="off"
        placeholder="4–8 Ziffern"
        aria-describedby="pinError pinNote"
        required
      />
      <button class="login-btn" id="loginBtn" type="submit">Entsperren</button>
      <p class="error" id="pinError" role="alert" aria-live="polite"></p>
    </form>

    <p class="note" id="pinNote">Nur für Personal · Sitzung endet nach 15 Minuten.</p>

    <div class="back-wrap">
      <a class="back" href="/">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
        Zurück zur Fotobox
      </a>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const $form = document.getElementById('pinForm');
      const $input = document.getElementById('pinInput');
      const $button = document.getElementById('loginBtn');
      const $error = document.getElementById('pinError');
      const $card = document.getElementById('loginCard');
      const $notice = document.getElementById('sessionNotice');

      // Feedback nach Logout/Idle-Timeout: Query oder Referrer von /admin.
      let cameFromAdmin = false;
      try {
        cameFromAdmin = !!document.referrer && new URL(document.referrer).pathname.startsWith('/admin');
      } catch (e) {}
      if (new URLSearchParams(window.location.search).has('loggedout') || cameFromAdmin) {
        $notice.hidden = false;
      }

      let busy = false;

      function showError(message) {
        $error.textContent = message;
        $card.classList.remove('is-shaking');
        void $card.offsetWidth;
        $card.classList.add('is-shaking');
      }

      function setBusy(value) {
        busy = value;
        $button.disabled = value;
        $button.textContent = value ? 'Prüfe…' : 'Entsperren';
        $input.disabled = value;
      }

      $input.addEventListener('input', () => {
        // Nur Ziffern zulassen; Einfügen aus der Zwischenablage wird bereinigt.
        const clean = $input.value.replace(/\D/g, '').slice(0, 8);
        if ($input.value !== clean) $input.value = clean;
        if ($error.textContent) $error.textContent = '';
      });

      $form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (busy) return;

        const pin = $input.value.trim();
        if (!/^\d{4,8}$/.test(pin)) {
          showError('Bitte eine PIN mit 4 bis 8 Ziffern eingeben.');
          $input.focus();
          return;
        }

        setBusy(true);
        $error.textContent = '';

        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
          });

          let data = {};
          try { data = await res.json(); } catch (e) { /* z. B. Proxy-Fehlerseite */ }

          if (res.ok) {
            // Bewusst neu laden: Bei /admin#retention würde ein reiner
            // Hash-Wechsel die PIN-Seite stehen lassen, statt die Admin-Seite
            // vom Server zu holen. Der Hash bleibt beim Reload erhalten.
            window.location.reload();
            return;
          }

          if (res.status === 401) {
            showError('PIN falsch. Bitte erneut versuchen.');
            $input.select();
          } else if (res.status === 429) {
            const seconds = Number(data.retryAfter) || 300;
            const minutes = Math.max(1, Math.ceil(seconds / 60));
            showError('Zu viele Versuche. Bitte in ' + minutes + ' Minute' + (minutes === 1 ? '' : 'n') + ' erneut versuchen.');
          } else {
            showError('Anmeldung fehlgeschlagen. Bitte erneut versuchen.');
          }
        } catch (err) {
          showError('Server nicht erreichbar. Bitte Verbindung prüfen.');
        } finally {
          setBusy(false);
          if (window.location.pathname !== '/admin') $input.focus();
        }
      });

      // Fokus erst nach dem ersten Frame, damit iOS die Tastatur nicht erzwingt.
      requestAnimationFrame(() => $input.focus({ preventScroll: true }));
    })();
  </script>
</body>
</html>
